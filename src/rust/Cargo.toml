[package]
name = "masbayes"
version = "0.6.1"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "masbayes"

[dependencies]
extendr-api = "0.7"
ndarray = { version = "0.16", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
rand_pcg = "0.3"
libm = "0.2"
statrs = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Note: panic = "abort" was tested but reverted because it kills the R session
# on a Rust panic (no graceful recovery). Default "unwind" lets R report the error.
