name: Build and Release Binary Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }} - ${{ matrix.config.rust-target }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - {os: windows-latest, r: 'release', rust-target: 'x86_64-pc-windows-gnu', ext: 'zip', arch: 'x64'}
          
          # macOS
          - {os: macOS-latest, r: 'release', rust-target: 'x86_64-apple-darwin', ext: 'tgz', arch: 'x64'}
          - {os: macos-14, r: 'release', rust-target: 'aarch64-apple-darwin', ext: 'tgz', arch: 'arm64'}
          
          # Linux (x64 only)
          - {os: ubuntu-latest, r: 'release', rust-target: 'x86_64-unknown-linux-gnu', ext: 'tar.gz', arch: 'x64'}
    
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Line Endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git checkout .
        shell: bash
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust-target }}
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "Rcpp"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Setup rextendr
        run: |
          install.packages("rextendr")
          rextendr::rust_sitrep()
        shell: Rscript {0}
      
      - name: Clean and prepare sources
        if: runner.os == 'Windows'
        run: |
          echo "=== Cleaning Rust build artifacts ==="
          rm -rf src/rust/target
          rm -f src/rust/Cargo.lock
        shell: bash
      
      - name: Build binary package
        shell: bash
        run: |
          echo "Installing package to temporary library..."
          mkdir -p tmp_lib
          R CMD INSTALL . --library=tmp_lib
          
          echo "Stripping source files for true binary..."
          rm -rf tmp_lib/masbayes/src/
          rm -f tmp_lib/masbayes/Makevars*
          
          echo "Creating binary package..."
          if [ "${{ runner.os }}" == "Windows" ]; then
            cd tmp_lib
            zip -r ../masbayes_binary.zip masbayes/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cd tmp_lib
            tar -czf ../masbayes_binary.tgz masbayes/
          else
            cd tmp_lib
            tar -czf ../masbayes_binary.tar.gz masbayes/
          fi
      
      - name: List built packages (debug)
        run: |
          echo "All files in working directory:"
          ls -lh
          echo "Binary package created:"
          ls -lh masbayes_binary.* 2>/dev/null || echo "Binary file not found in root"
        shell: bash

      - name: Rename for Upload
        id: rename_step
        shell: bash
        run: |
          FILE="masbayes_binary.${{ matrix.config.ext }}"
          NEW_NAME="masbayes_${{ matrix.config.arch }}_${{ matrix.config.rust-target }}.${{ matrix.config.ext }}"
          mv "$FILE" "$NEW_NAME"
          echo "pkg_file=$NEW_NAME" >> $GITHUB_OUTPUT
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.config.os }}-${{ matrix.config.rust-target }}
          path: ${{ steps.rename_step.outputs.pkg_file }}
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write 
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_binaries 
          pattern: pkg-*
          merge-multiple: true
          
      - name: Debug - List Downloaded Files
        run: |
          echo "Daftar file yang akan di-release:"
          ls -R all_binaries
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_binaries/*
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}