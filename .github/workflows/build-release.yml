name: Build and Release Binary Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }} - ${{ matrix.config.rust-target }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - {os: windows-latest, r: 'release', rust-target: 'x86_64-pc-windows-gnu', ext: 'zip', arch: 'x64'}
          
          # macOS
          - {os: macOS-latest, r: 'release', rust-target: 'x86_64-apple-darwin', ext: 'tgz', arch: 'x64'}
          - {os: macos-14, r: 'release', rust-target: 'aarch64-apple-darwin', ext: 'tgz', arch: 'arm64'}
          
          # Linux (x64 only)
          - {os: ubuntu-latest, r: 'release', rust-target: 'x86_64-unknown-linux-gnu', ext: 'tar.gz', arch: 'x64'}
    
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Line Endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git checkout .
        shell: bash
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust-target }}
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "Rcpp"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Setup rextendr
        run: |
          install.packages("rextendr")
          rextendr::rust_sitrep()
        shell: Rscript {0}
      
      - name: Clean and prepare sources
        if: runner.os == 'Windows'
        run: |
          echo "=== Cleaning Rust build artifacts ==="
          rm -rf src/rust/target
          rm -f src/rust/Cargo.lock
        shell: bash
      
      - name: Build binary package
        shell: bash
        env:
          R_CUSTOM_TAR: "internal"
          R_BUILD_TAR: "internal"
          R_INSTALL_TAR: "internal"
          TAR: "internal"
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "Building binary directly from source to avoid tar.gz issues on Windows..."
            R CMD INSTALL --build . --no-manual
          else
            echo "Building source then binary for Unix-like OS..."
            R CMD build . --no-manual
            PKG_SRC=$(ls masbayes_*.tar.gz | head -n 1)
            R CMD INSTALL --build "$PKG_SRC"
          fi
      
      - name: List built packages (debug)
        run: |
          echo "All files matching masbayes*:"
          ls -lh masbayes*
        shell: bash

      - name: Rename package file
        id: rename_step 
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            FILE=$(find . -maxdepth 1 -name "masbayes_*_R_*.tar.gz" -type f | head -n 1)
          elif [ "${{ runner.os }}" == "Windows" ]; then
            FILE=$(find . -maxdepth 1 -name "masbayes*.zip" -type f | head -n 1)
          else
            FILE=$(find . -maxdepth 1 -name "masbayes*.tgz" -type f | head -n 1)
          fi
          
          if [ -z "$FILE" ]; then
            echo "Error: Binary package not found"
            ls -la
            exit 1
          fi
          
          NEW_NAME="masbayes_${{ matrix.config.arch }}_${{ matrix.config.rust-target }}_R${{ matrix.config.r }}.${{ matrix.config.ext }}"
          mv "$FILE" "$NEW_NAME"
          echo "pkg_file=$NEW_NAME" >> $GITHUB_OUTPUT # Simpan nama file ke output
        shell: bash
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.config.os }}-${{ matrix.config.rust-target }}
          path: ${{ steps.rename_step.outputs.pkg_file }}
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write 
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_binaries 
          pattern: binary-*
          merge-multiple: true
          
      - name: Debug - List Downloaded Files
        run: |
          echo "Daftar file yang akan di-release:"
          ls -R all_binaries
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}