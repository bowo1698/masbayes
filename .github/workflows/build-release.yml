name: Build and Release Binary Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }} - ${{ matrix.config.rust-target }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          # Windows
          - {os: windows-latest, r: 'release', rust-target: 'x86_64-pc-windows-gnu', ext: 'zip', arch: 'x64'}
          - {os: windows-latest, r: 'release', rust-target: 'aarch64-pc-windows-msvc', ext: 'zip', arch: 'arm64'}
          
          # macOS
          - {os: macOS-latest, r: 'release', rust-target: 'x86_64-apple-darwin', ext: 'tgz', arch: 'x64'}
          - {os: macos-14, r: 'release', rust-target: 'aarch64-apple-darwin', ext: 'tgz', arch: 'arm64'}
          
          # Linux (x64 only)
          - {os: ubuntu-latest, r: 'release', rust-target: 'x86_64-unknown-linux-gnu', ext: 'tar.gz', arch: 'x64'}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust-target }}
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "Rcpp"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Setup rextendr
        run: |
          install.packages("rextendr")
          rextendr::rust_sitrep()
        shell: Rscript {0}
      
      - name: Clean and prepare sources
        if: runner.os == 'Windows'
        run: |
          echo "=== Cleaning Rust build artifacts ==="
          rm -rf src/rust/target
          rm -f src/rust/Cargo.lock
          
          echo "=== Setting proper permissions ==="
          find src -type f -exec chmod 644 {} \;
          find src -type d -exec chmod 755 {} \;
          
          echo "=== Verifying no symlinks ==="
          find . -type l
        shell: bash

      - name: Build binary package
        env:
          TAR: ${{ runner.os == 'Windows' && 'tar --format=ustar' || 'tar' }}
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            R CMD build --no-manual .
          else
            R CMD build .
          fi
          PKG=$(ls masbayes_*.tar.gz | head -n 1)
          echo "Building binary from: $PKG"
          R CMD INSTALL --build "$PKG"
        shell: bash
      
      - name: List built packages (debug)
        run: |
          echo "All files matching masbayes*:"
          ls -lh masbayes*
        shell: bash

      - name: Rename package file
        run: |
          # Find the binary package (not source)
          if [ "${{ runner.os }}" == "Linux" ]; then
            FILE=$(find . -maxdepth 1 -name "masbayes_*_R_*.tar.gz" -type f | head -n 1)
          elif [ "${{ runner.os }}" == "Windows" ]; then
            FILE=$(find . -maxdepth 1 -name "masbayes*.zip" -type f | head -n 1)
          else
            FILE=$(find . -maxdepth 1 -name "masbayes*.tgz" -type f | head -n 1)
          fi
          
          if [ -z "$FILE" ]; then
            echo "Error: Binary package not found"
            ls -la masbayes*
            exit 1
          fi
          
          NEW_NAME="masbayes_${{ matrix.config.arch }}_${{ matrix.config.rust-target }}_R${{ matrix.config.r }}.${{ matrix.config.ext }}"
          mv "$FILE" "$NEW_NAME"
          echo "Renamed: $FILE -> $NEW_NAME"
        shell: bash
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.config.os }}-${{ matrix.config.rust-target }}
          path: masbayes_*
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write 
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/masbayes_*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}